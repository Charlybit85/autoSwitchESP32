<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión</title>
  <style>
    :root {
      --azul-oscuro: #14305f;
      --azul: #1d4ed8;
      --fondo: #f4f6fa;
      --borde: #d6dde9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: var(--fondo); color: #1f2937;
      font-family: system-ui, sans-serif;
    }
    .panel {
      width: 100%; max-width: 400px; margin: 16px;
      background: white; border: 1px solid var(--borde);
      border-radius: 14px; overflow: hidden;
      box-shadow: 0 4px 20px rgba(20, 48, 95, 0.1);
    }
    h1 {
      margin: 0; padding: 20px 24px; text-align: center;
      background: var(--azul-oscuro); color: white; font-size: 1.25rem;
    }
    form { padding: 24px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.9rem; }
    input {
      width: 100%; padding: 12px; margin-bottom: 18px;
      border: 1px solid var(--borde); border-radius: 8px; font-size: 1rem;
    }
    input:focus { outline: 2px solid var(--azul); border-color: var(--azul); }
    button {
      width: 100%; padding: 14px; border: none; border-radius: 10px;
      background: var(--azul); color: white;
      font-size: 1rem; font-weight: 600; cursor: pointer;
    }
    button:hover { background: var(--azul-oscuro); }
    .error {
      margin: 0 0 18px; padding: 10px; border-radius: 8px;
      background: #fee2e2; color: #991b1b; font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main class="panel">
    <h1>Control de Interruptor</h1>
    <form method="post">
      {% if error %}<p class="error">{{ error }}</p>{% endif %}

      <label for="usuario">Usuario</label>
      <input id="usuario" name="usuario" type="text" autocomplete="username" required autofocus>

      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <button type="submit">Entrar</button>
    </form>
  </main>
</body>
</html>
